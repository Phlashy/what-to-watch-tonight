name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches the Raspberry Pi (production) runtime

      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build
        working-directory: client

      # The Pi deploys by `git pull` and never builds, so the committed
      # client/dist must always match the source. If this fails, someone
      # changed client code without running `npm run build` and committing
      # the refreshed bundle.
      - name: Committed client/dist must match the built output
        run: |
          if [ -n "$(git status --porcelain -- client/dist)" ]; then
            echo "::error::client/dist is stale — run 'npm run build' at the repo root and commit the result."
            git status --porcelain -- client/dist
            exit 1
          fi

      # Fail the build on high/critical advisories in code that runs in
      # production. Root and server are audited in full.
      - name: Security audit (root)
        run: npm audit --audit-level=high
      - name: Security audit (server)
        run: npm audit --audit-level=high
        working-directory: server
      # The client ships as prebuilt static assets — its devDependencies (the
      # Vite/esbuild/Babel build toolchain) never reach the Pi or a user's
      # browser, so a high advisory in the dev server isn't a production risk.
      # Audit only what actually ships (--omit=dev). The dev-toolchain advisories
      # are tracked in KNOWN-ISSUES; clearing them at source = a Vite major
      # upgrade, deferred deliberately.
      - name: Security audit (client, shipped deps only)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client
